# This workflow will build a package using Maven and then publish it to GitHub Pages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [created]

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'debug'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true
      ghptag:
        description: 'Tag for the GitHub Pages (must be gh-pages-vx.x.x and match master branch tag)'
        required: true
        type: string

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # The HTML+JavaScript project is located in the web/ folder, so build from there.
    - name: Build with Maven
      run: mvn -B clean verify --file web/pom.xml

#    - name: Publish to GitHub Packages Apache Maven
#      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
#      env:
#        GITHUB_TOKEN: ${{ github.token }}

    # Publish ONLY the built site (web/target) to the gh-pages branch, so GitHub Pages serves the final build output and not the whole repository.
    - name: Deploy to GitHub Pages
      id: gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./web/target
        publish_branch: gh-pages

    - name: Tag gh-pages commit
      run: |
        git fetch origin gh-pages
        LATEST_HASH=$(git rev-parse origin/gh-pages)
        git tag ${{ inputs.ghptag }} $LATEST_HASH
        git push origin ${{ inputs.ghptag }}
