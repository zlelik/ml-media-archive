<!DOCTYPE html>

    </div>
    <div class="grid-and-preview">
      <div id="myGrid"></div>
      <!-- Resize Handle between Grid and Preview Div -->
      <div class="resize-handle" id="resize-handle"></div>
      <div class="preview-div" id="preview_pane">Preview</div>
    </div>
  </div>
  <div id="col_prefs" class="popup-wnd cols-wnd">
    <div class="close-btn" onclick="onClosePrefsClick()">×</div>
    <div class="top-btn-container">
      <button id="select_all_btn" onClick="onSelectAllClick()">Select All</button>
      <button id="deselect_all_btn" onClick="onDeselectAllClick()">Deselect All</button>
    </div>
    <div class="checkbox_list" id="col_list"></div>
    <div class="bottom-btn-container">
      <button id="ok_prefs" onClick="onOkPrefsClick()">OK</button>
      <button id="cancel_prefs" onClick="onCancelPrefsClick()">Cancel</button>
    </div>
  </div>

  <!-- Map selector (hidden by default) -->
  <div id="map_selector" class="popup-wnd map-selector-popup">
    <div class="close-btn" onclick="closeMapSelector()">×</div>
    <div id="map" class="map-cls"></div>
    <div class="bottom-btn-container">
      <button onclick="saveRectangle()">OK</button>
      <button onclick="closeMapSelector()">Cancel</button>
    </div>
  </div>

  <!-- Pop-up element for image full description -->
  <div id="desc-popup" class="popup-wnd desc-popup-wnd"></div>
  <!-- Pop-up element for video objects details -->
  <div id="video-desc-popup" class="popup-wnd desc-popup-wnd video-desc-popup-wnd">
    <div class="close-btn" onclick="closeVideoDescPopup()">×</div>
    <div style="margin-bottom: 10px;">
      <button id="copy_current_btn" class="svg-btn" title="Copy currently displayed text" onclick="copyCurrentVideoDetails()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M480 400L288 400C279.2 400 272 392.8 272 384L272 128C272 119.2 279.2 112 288 112L421.5 112C425.7 112 429.8 113.7 432.8 116.7L491.3 175.2C494.3 178.2 496 182.3 496 186.5L496 384C496 392.8 488.8 400 480 400zM288 448L480 448C515.3 448 544 419.3 544 384L544 186.5C544 169.5 537.3 153.2 525.3 141.2L466.7 82.7C454.7 70.7 438.5 64 421.5 64L288 64C252.7 64 224 92.7 224 128L224 384C224 419.3 252.7 448 288 448zM160 192C124.7 192 96 220.7 96 256L96 512C96 547.3 124.7 576 160 576L352 576C387.3 576 416 547.3 416 512L416 496L368 496L368 512C368 520.8 360.8 528 352 528L160 528C151.2 528 144 520.8 144 512L144 256C144 247.2 151.2 240 160 240L176 240L176 192L160 192z"/></svg></button>
      <label for="video_desc_format">Format:</label>
      <select id="video_desc_format" onchange="onVideoDescFormatChange()">
        <option value="youtube">YouTube</option>
        <option value="detailed">Detailed</option>
      </select>
    </div>
    <div id="video_desc_content"></div>
  </div>
  <!-- Pop-up element for object labels selection -->
  <div id="choose_objects_popup" class="popup-wnd choose-objects-popup">
    <div class="close-btn" onclick="closeChooseObjectsPopup()">×</div>
    <div id="choose_objects_header" class="choose-objects-header">Choose Objects</div>
    <div id="choose_objects_content" class="choose-objects-content"></div>
  </div>

  <script src="archive-search.js"></script>
</body>

</html>
